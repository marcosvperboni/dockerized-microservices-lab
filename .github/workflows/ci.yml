name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  order-service:
    name: order-service (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        working-directory: order-service
        run: ./mvnw -B verify

  inventory-service:
    name: inventory-service (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        working-directory: inventory-service
        run: ./mvnw -B verify

  notification-service:
    name: notification-service (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: notification-service
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: notification-service
        run: pytest -q

  compose-build:
    name: Validate compose build
    runs-on: ubuntu-latest
    needs: [order-service, inventory-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local secrets
        run: |
          mkdir -p secrets
          echo "ci-postgres-password" > secrets/postgres_password.txt
          echo "ci-rabbitmq-password" > secrets/rabbitmq_password.txt
      - name: Build all images
        run: docker compose build
